name: Cooksy
options:
  bundleIdPrefix: com.cooksy
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
targets:
  Cooksy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Cooksy
        excludes:
          - Resources/**
    resources:
      - path: Sources/Cooksy/Resources/Assets.xcassets
      - path: Sources/Cooksy/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cooksy.app
        PRODUCT_NAME: Cooksy
        INFOPLIST_FILE: Sources/Cooksy/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Cooksy/Resources/Cooksy.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 65
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
